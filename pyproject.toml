[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "VegZ"
version = "1.5.0"
authors = [
  {name="Mohamed Z. Hatim", email="mhatim4040@gmail.com"},
]
description = "A comprehensive Python package for vegetation data analysis and environmental modeling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = [
    "vegetation", "ecology", "biodiversity", "clustering", "ordination",
    "diversity", "multivariate", "environmental", "TWINSPAN", "elbow-analysis",
    "machine learning", "modelling", "species-validation", "taxonomic-names",
    "data-quality", "error-detection"
]

# Core dependencies
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.0",
    "seaborn>=0.11.0",
    "requests>=2.25.0",
]

# Optional dependencies
[project.optional-dependencies]
spatial = [
    "geopandas>=0.10.0",
    "pyproj>=3.2.0",
    "rasterio>=1.2.0",
    "shapely>=1.8.0",
]
remote-sensing = [
    "earthengine-api>=0.1.300",
    "geemap>=0.13.0",
    "xarray>=0.20.0",
    "netcdf4>=1.5.0",
]
fuzzy = [
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.12.0",
]
excel = [
    "openpyxl>=3.0.0",
    "xlrd>=2.0.1",
]
network = [
    "networkx>=2.6",
]
timeseries = [
    "statsmodels>=0.13.0",
]
interactive = [
    "plotly>=5.0.0",
    "bokeh>=2.4.0",
    "ipywidgets>=7.6.0",
]
all = [
    "geopandas>=0.10.0",
    "pyproj>=3.2.0",
    "shapely>=1.8.0",
    "fuzzywuzzy>=0.18.0",
    "openpyxl>=3.0.0",
    "networkx>=2.6",
    "statsmodels>=0.13.0",
    "plotly>=5.0.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
    # Optional runtime dependencies are included here on purpose: without them
    # the code paths that use them are skipped in every CI job and go untested.
    "openpyxl>=3.0.0",
    "statsmodels>=0.13.0",
    "networkx>=2.6",
    "plotly>=5.0.0",
    "pyproj>=3.2.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/mhatim99/VegZ"
Documentation = "https://mhatim99.github.io/VegZ/"
Repository = "https://github.com/mhatim99/VegZ.git"
"Bug Reports" = "https://github.com/mhatim99/VegZ/issues"
Changelog = "https://github.com/mhatim99/VegZ/blob/main/CHANGELOG.md"

# Temporarily disable demo script until examples module is properly structured
# [project.scripts]
# VegZ-demo = "VegZ.examples.demo:main"

[tool.hatch.version]
path = "src/VegZ/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/VegZ"]
# py.typed tells type checkers the inline annotations are meant to be used.
artifacts = ["src/VegZ/py.typed"]

# Ship the source, tests, docs and example data in the sdist - but nothing else.
# Listing includes explicitly (rather than relying on excludes) keeps build
# artefacts, caches and editor droppings out of the release by construction.
[tool.hatch.build.targets.sdist]
include = [
    "/src/VegZ",
    "/tests",
    "/examples",
    "/docs",
    "/test_data",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.ipynb_checkpoints",
]

[tool.hatch.metadata]
allow-direct-references = true

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "error::FutureWarning:VegZ.*",
    "error::DeprecationWarning:VegZ.*",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Type checking
#
# The code base predates type checking and mypy reports ~330 issues in the
# legacy modules, mostly pandas/numpy operator overloads it cannot follow.
# Rather than blanket-disabling mypy (which enforces nothing) or committing a
# failing config (which gets ignored), checking is switched ON per module and
# the list grows as modules are cleaned up.
[tool.mypy]
# Not the package's minimum (3.9): mypy 2.0 dropped support for targeting
# anything below 3.10, and NumPy's bundled stubs use PEP 695 `type` statements
# that mypy cannot parse unless the target is 3.12 or higher - so 3.10 and 3.11
# fail on numpy/__init__.pyi before reaching any VegZ code. Runtime support for
# 3.9 is guaranteed by the CI matrix, which still runs the full suite there.
python_version = "3.12"
files = ["src/VegZ"]
ignore_missing_imports = true       # the optional geospatial/ML stack is untyped
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
ignore_errors = true                # default off; enabled per module below

[[tool.mypy.overrides]]
# Modules written or rewritten with type checking in mind.
module = ["VegZ._compat", "VegZ.dataset"]
ignore_errors = false
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

# Linting
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
# Deliberately scoped to rules that catch real defects, so the gate is enabled
# and green rather than aspirational. Cosmetic rules (whitespace, annotation
# modernisation) would need a 3000-line mechanical diff across a code base that
# is otherwise stable; they are listed below as explicit, revisitable debt.
select = [
    "F",    # pyflakes: undefined names, unused variables, bad f-strings
    "B",    # bugbear: mutable defaults, loop-variable closures, bare raises
    "E4",   # import errors
    "E7",   # statement errors (bare except, comparisons to None/True)
    "E9",   # syntax and IO errors
]
ignore = [
    "E501",   # line length: not enforced, no formatter is run in CI
    "B008",   # function call in argument default: used intentionally for range()
    # --- Accepted debt, tracked rather than silently disabled ---------------
    "B028",   # warnings.warn without stacklevel: 63 call sites; fixing them
              # would improve where warnings point, but needs care with the
              # multi-line calls. Worth doing, not worth a risky bulk regex.
    "F541",   # f-string without placeholders: harmless, 10 sites
]

[tool.ruff.lint.per-file-ignores]
# The data_management/data_quality packages deliberately re-export via star
# imports to keep the public API flat.
"src/VegZ/__init__.py" = ["F401", "E402"]
"src/VegZ/data_management/__init__.py" = ["F401", "F403", "F405"]
"src/VegZ/data_quality/__init__.py" = ["F401", "F403", "F405"]
"tests/*" = ["B011", "F401"]
